
    <!DOCTYPE html>
    <html>
    <head>
        <title>Мониторинг Карта 2.0</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            #map { height: 100vh; width: 100%; background: #1a1a1a; }
            body { margin: 0; padding: 0; }
            .pulse {
                width: 15px; height: 15px;
                background: red; border-radius: 50%;
                box-shadow: 0 0 0 rgba(255, 0, 0, 0.4);
                animation: pulse-red 1.5s infinite;
            }
            @keyframes pulse-red {
                0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
                70% { box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); }
                100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
            }
            .update-time {
                position: absolute; bottom: 10px; left: 10px; z-index: 1000;
                background: rgba(0,0,0,0.7); color: white; padding: 5px 10px;
                font-family: sans-serif; font-size: 12px; border-radius: 5px;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <div class="update-time">Обновлено: 16:18:12</div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            var map = L.map('map').setView([48.0, 40.0], 6);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            var alerts = [{'coords': [48.92, 40.39], 'text': 'Угроза БПЛА в районе Миллерово! Всем в укрытие.', 'is_new': True}, {'coords': [47.23, 39.72], 'text': 'Ростовская область - работает ПВО', 'is_new': False}, {'coords': [51.23, 58.46], 'text': 'Орск: мониторинг паводковой ситуации в норме', 'is_new': False}, {'coords': [48.35, 41.82], 'text': 'Взрывы в районе города Морозовск', 'is_new': True}];
            
            alerts.forEach(function(alert) {
                if (alert.is_new) {
                    var icon = L.divIcon({ className: 'pulse', iconSize: [15, 15] });
                    L.marker(alert.coords, {icon: icon}).addTo(map).bindPopup("<b>СРОЧНО:</b><br>" + alert.text);
                } else {
                    L.circleMarker(alert.coords, {radius: 7, color: 'orange', fillOpacity: 0.8}).addTo(map)
                        .bindPopup(alert.text);
                }
            });
        </script>
    </body>
    </html>
